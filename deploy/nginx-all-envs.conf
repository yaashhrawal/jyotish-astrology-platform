# =====================================================================
# Jyotish SaaS — Nginx config for Oracle Always Free VM
# All 3 environments on one server:
#   Production:  yourdomain.com          → backend port 8888
#   Staging:     staging.yourdomain.com  → backend port 8889
#   Demo:        demo.yourdomain.com     → backend port 8890
# =====================================================================

# --- PRODUCTION ---
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/jyotish;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    gzip on; gzip_types text/plain text/css application/javascript application/json;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# --- STAGING ---
server {
    listen 443 ssl http2;
    server_name staging.yourdomain.com;
    root /var/www/jyotish-staging;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # Basic auth on staging — keep bots out
    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    ssl_certificate     /etc/letsencrypt/live/staging.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

server {
    listen 443 ssl http2;
    server_name api-staging.yourdomain.com;
    location / {
        proxy_pass http://127.0.0.1:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
    ssl_certificate     /etc/letsencrypt/live/api-staging.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# --- DEMO ---
server {
    listen 443 ssl http2;
    server_name demo.yourdomain.com;
    root /var/www/jyotish-demo;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    ssl_certificate     /etc/letsencrypt/live/demo.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    gzip on; gzip_types text/plain text/css application/javascript application/json;
}

server {
    listen 443 ssl http2;
    server_name api-demo.yourdomain.com;
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
    ssl_certificate     /etc/letsencrypt/live/api-demo.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-demo.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# HTTP → HTTPS redirect (all domains)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com api.yourdomain.com
                staging.yourdomain.com api-staging.yourdomain.com
                demo.yourdomain.com api-demo.yourdomain.com;
    return 301 https://$host$request_uri;
}
