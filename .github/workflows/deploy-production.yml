name: Deploy → Production

on:
  workflow_dispatch:           # manual trigger only
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production release'
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy keyword
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Must type 'deploy' to confirm. Got: ${{ github.event.inputs.confirm }}"
          exit 1

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build frontend (production)
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_ENV: production

      - name: Deploy to Oracle VM (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/jyotish
            git fetch origin main
            git checkout main
            git pull origin main

            source backend/venv/bin/activate
            pip install -q -r backend/requirements.txt
            sudo systemctl restart jyotish-backend
            sleep 2

            sudo rsync -a --delete frontend/dist/ /var/www/jyotish/
            sudo systemctl reload nginx
            echo "Production deploy complete"
